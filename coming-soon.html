<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | CandyLoop Food Truck</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <section class="soon">
    <img src="assets/img/loaded_funnel_cake.png" alt="Background" class="soon-bg">

    <div class="soon-inner container">
      <a href="index.html" class="logo" style="justify-content:center;margin-bottom:2rem;">
        <span class="logo-mark"></span>Candy<span>Loop</span>
      </a>

      <h1>We're spinning up <br><span style="background:linear-gradient(120deg,var(--pink),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;">something sweet.</span></h1>
      <p style="color:rgba(255,255,255,0.75);max-width:32rem;margin:1rem auto 0;">Our new website is almost ready. We're adding the final dusting of powdered sugar to give you the best booking experience.</p>

      <div class="count">
        <div>
          <strong>14</strong>
          <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.5);">Days</span>
        </div>
        <div>
          <strong>08</strong>
          <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.5);">Hours</span>
        </div>
        <div>
          <strong>45</strong>
          <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.5);">Minutes</span>
        </div>
        <div>
          <strong>12</strong>
          <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.5);">Seconds</span>
        </div>
      </div>

      <div style="max-width:24rem;margin:0 auto 2rem;">
        <p class="eyebrow" style="color:rgba(255,255,255,0.5);">Get notified when we launch</p>
        <form class="news-form" action="#" style="position:relative;">
          <input type="email" placeholder="Enter your email address" required style="padding-right:7rem;">
          <button type="submit" class="btn btn-primary" style="position:absolute;right:0.3rem;top:0.3rem;bottom:0.3rem;padding:0 1.2rem;">Notify Me</button>
        </form>
      </div>

      <div class="socials" style="justify-content:center;">
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="X">X</a>
        <a href="#" aria-label="Facebook">FB</a>
      </div>
    </div>
  </section>
</body>
</html>
